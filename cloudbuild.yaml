steps:
  # 1. Build the backend Docker image (Uses cache if no Python/C changes!)
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/double-checkk-api:$COMMIT_SHA",
        "-f",
        "CloudRun/Dockerfile",
        "CloudRun",
      ]

  # 2. Push the image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/double-checkk-api:$COMMIT_SHA",
      ]

  # 3. Automatically deploy the new image to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "double-checkk-api",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/double-checkk-api:$COMMIT_SHA",
        "--region",
        "us-central1",
      ]

  # 4. Install dependencies and build the React frontend
  - name: "node:20"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        cd web
        npm install
        npm run build

  # 5. Deploy the frontend to Firebase Hosting
  - name: "node:20"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        cd web
        npx firebase-tools deploy --project=$PROJECT_ID --only hosting --force

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/double-checkk-api:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
