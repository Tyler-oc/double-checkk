steps:
  # 1. PULL THE CACHE: Download the latest image to use as a template.
  # "|| true" ensures the build doesn't crash if this is the very first run and the image doesn't exist yet.
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker pull us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/double-checkk-api:latest || true

  # 2. BUILD THE API: Uses the pulled image as a cache to skip the 30-minute Frama-C installation.
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--cache-from",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/double-checkk-api:latest",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/double-checkk-api:$COMMIT_SHA",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/double-checkk-api:latest",
        "-f",
        "CloudRun/Dockerfile",
        "CloudRun",
      ]

  # 3. PUSH BOTH TAGS: Saves the specific commit for Cloud Run, and the 'latest' tag for future caching.
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/double-checkk-api",
        "--all-tags",
      ]

  # 4. DEPLOY TO CLOUD RUN: Automatically shifts traffic to the new image.
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "double-checkk-api",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/double-checkk-api:$COMMIT_SHA",
        "--region",
        "us-central1",
      ]

  # 5. BUILD REACT APP: Compiles the frontend.
  - name: "node:20"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        cd web
        npm install
        npm run build

  # 6. DEPLOY TO FIREBASE: Pushes the compiled frontend to the global CDN.
  - name: "node:20"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        cd web
        npx firebase-tools deploy --project=$PROJECT_ID --only hosting --force

options:
  logging: CLOUD_LOGGING_ONLY
